[package]
name = "sms_sender_sm2"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
base64 = "0.21"
hex = "0.4"
futures = "0.3"
regex = "1"
sm2 = "0.13.3"
num-bigint = "0.4"

[profile.release]
lto = true
codegen-units = 1